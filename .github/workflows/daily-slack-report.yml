name: Daily Slack Revenue Report

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Send Revenue Report to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          MONTH_FILE=august/index.html
          MONTH_NAME=August
          DAYS_IN_MONTH=31
          MEMBERSHIP=12618

          MTD=$(grep -oP "'2026-08-\d+': \K[\d.]+" $MONTH_FILE | awk '{s+=$1} END {print s}')
          DAYS=$(grep -oP "'2026-08-\d+'" $MONTH_FILE | wc -l)
          TARGET=$(grep -oP "const targetTotal = \K\d+" $MONTH_FILE)
          DAYS_REM=$((DAYS_IN_MONTH - DAYS))

          FORMAT() { printf "%.0f" "$1" | sed -e :a -e 's/\B[0-9]\{3\}\>/,&/g;ta'; }

          DAILY_AVG=$(awk "BEGIN {printf \"%.0f\", ($MTD - $MEMBERSHIP) / ($DAYS - 1)}")
          MTD_FMT=$(FORMAT $MTD)
          AVG_FMT=$(FORMAT $DAILY_AVG)
          TARGET_FMT=$(FORMAT $TARGET)

          post() {
            curl -sS -X POST -H 'Content-type: application/json' \
              --data "{\"text\":$1}" "$SLACK_WEBHOOK_URL"
          }

          if [ "$DAYS_REM" -le 0 ]; then
            PCT=$(awk "BEGIN {printf \"%.1f\", 100*$MTD/$TARGET}")
            DELTA=$(awk "BEGIN {printf \"%.0f\", $MTD-$TARGET}")
            MSG=$(printf '%s\n' \
              "✅ *$MONTH_NAME Final*" \
              "• Final Revenue: \$$MTD_FMT" \
              "• Days Complete: $DAYS" \
              "• Service Daily Avg: \$$AVG_FMT" \
              "• EoM Target: \$$TARGET_FMT" \
              "• Result: $PCT% of target (\$$DELTA)" | jq -Rs .)
            post "$MSG"
            exit 0
          fi

          PROJECTION=$(awk "BEGIN {printf \"%.0f\", $MTD + ($DAILY_AVG * $DAYS_REM)}")
          PACE_NEEDED=$(awk "BEGIN {printf \"%.0f\", ($TARGET - $MTD) / $DAYS_REM}")
          PROJ_FMT=$(FORMAT $PROJECTION)
          PACE_FMT=$(FORMAT $PACE_NEEDED)

          TIERS=""
          for d in 500 600 700 800 900 1000; do
            V=$(awk "BEGIN {printf \"%.0f\", $MTD + ($d * $DAYS_REM)}")
            TIERS="$TIERS\n• \$$d/day → \$$(FORMAT $V)"
          done

          MSG=$(printf '%s\n' \
            "• MTD: \$$MTD_FMT (latest 8/$DAYS)" \
            "• Days Complete: $DAYS | Days Remaining: $DAYS_REM" \
            "• Current Daily Avg: \$$AVG_FMT" \
            "• Projected Close: \$$PROJ_FMT" \
            "• EoM Target: \$$TARGET_FMT" \
            "• Daily Pace Needed: \$$PACE_FMT to hit target" \
            "" \
            "Daily Average Scenarios:$(printf "$TIERS")" | jq -Rs .)
          post "$MSG"
