name: Daily Slack Revenue Report

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Send August Revenue to Slack
        run: |
          # Extract dailyRevenue entries from August tracker
          ENTRIES=$(grep -oP "'2026-08-\d+': \K[\d.]+(?=,)" august/index.html | tr '\n' ' ')
          
          # Calculate MTD sum
          MTD=$(echo "$ENTRIES" | awk '{sum=0; for(i=1;i<=NF;i++) sum+=$i; print sum}')
          
          # Count days
          DAYS=$(grep -oP "'2026-08-\d+'" august/index.html | wc -l)
          
          # Extract target
          TARGET=$(grep -oP "const targetTotal = \K\d+" august/index.html)
          
          echo "MTD: $MTD, Days: $DAYS, Target: $TARGET"
          
          # Calculate derived values
          DAYS_REM=$((31 - DAYS))
          DAILY_AVG=$(awk "BEGIN {printf \"%.0f\", ($MTD - 12618) / ($DAYS - 1)}")
          PROJECTION=$(awk "BEGIN {printf \"%.0f\", $MTD + ($DAILY_AVG * $DAYS_REM)}")
          
          # Format numbers with commas
          MTD_FMT=$(printf "%.0f" $MTD | sed -e :a -e 's/\B[0-9]\{3\}\>/,&/g;ta')
          AVG_FMT=$(printf "%.0f" $DAILY_AVG | sed -e :a -e 's/\B[0-9]\{3\}\>/,&/g;ta')
          PROJ_FMT=$(printf "%.0f" $PROJECTION | sed -e :a -e 's/\B[0-9]\{3\}\>/,&/g;ta')
          TARGET_FMT=$(printf "%.0f" $TARGET | sed -e :a -e 's/\B[0-9]\{3\}\>/,&/g;ta')
          
          # Build tier lines
          TIERS=$(for d in 100 200 300 400 500 600 700 800 900 1000; do
            PROJ=$(awk "BEGIN {printf \"%.0f\", $MTD + ($d * $DAYS_REM)}" | sed -e :a -e 's/\B[0-9]\{3\}\>/,&/g;ta')
            echo "  \$$d/day → \$$PROJ"
          done | tr '\n' '\\n')
          
          # Build message using jq for proper JSON escaping
          MESSAGE=$(jq -n --arg mtd "$MTD_FMT" --arg days "$DAYS" --arg days_rem "$DAYS_REM" --arg avg "$AVG_FMT" --arg proj "$PROJ_FMT" --arg target "$TARGET_FMT" --arg tiers "$TIERS" \
            '{"text": "📊 *August Revenue Status*\n\n*Where We Stand:*\n• MTD: $\($mtd)\n• Days Complete: \($days) | Days Remaining: \($days_rem)\n\n*Performance:*\n• Current Daily Avg: $\($avg)/day\n• Projected Close: $\($proj)\n• Target: $\($target)\n\n*Daily Average Needed to Hit:*\n\($tiers)"}')
          
          curl -X POST -H 'Content-type: application/json' \
            --data "$MESSAGE" \
            "${{ secrets.SLACK_WEBHOOK_URL }}"
          
          echo "Message sent"

