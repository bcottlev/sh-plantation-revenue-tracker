name: Daily Slack Revenue Report

on:
  schedule:
    - cron: '0 5 * * *'   # 1 AM ET; GitHub starts scheduled runs 4-5 h late, so this lands ~6 AM
  workflow_dispatch:
    inputs:
      month:
        description: 'Month to report as YYYY-MM (blank = current month)'
        required: false
        default: ''
      store:
        description: 'Store slug: plantation, pbg-east, pbg-northlake, cooper-city (blank = all)'
        required: false
        default: ''

jobs:
  # read last night's end-of-shift reports first, so the report never lags the manager's form
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Pull end-of-shift reports into the trackers
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: python3 pull_eos_desk.py || true
      - name: Commit if changed
        run: |
          git config user.email "bcottlev@gmail.com"
          git config user.name "GitHub Automation"
          git add day-of-week/index.html eos_status.txt
          git add -A -- '*/index.html'
          git diff --cached --quiet && echo "no change" || (git commit -m "Update EOS desk roster and manager revenue" && git pull --rebase && git push)

  send-report:
    needs: ingest
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        store: [plantation, pbg-east, pbg-northlake, cooper-city]
    steps:
      - uses: actions/checkout@v4

      - name: Send Revenue Report to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          REPORT_CHANNEL: C0C9WCYKX8A     # #plantation-revenue-updates (the bot must be a member)
          INPUT_MONTH: ${{ github.event.inputs.month }}
          INPUT_STORE: ${{ github.event.inputs.store }}
          STORE: ${{ matrix.store }}
        run: |
          # ---- which store (a dispatch can name one; the schedule runs every store that has a tracker) ----
          if [ -n "$INPUT_STORE" ] && [ "$INPUT_STORE" != "$STORE" ]; then echo "skip $STORE"; exit 0; fi
          case "$STORE" in
            plantation)    STORE_NAME="Plantation";    STORE_DIR="" ;;
            pbg-east)      STORE_NAME="PBG East";      STORE_DIR="stores/pbg-east/" ;;
            pbg-northlake) STORE_NAME="PBG Northlake"; STORE_DIR="stores/pbg-northlake/" ;;
            cooper-city)   STORE_NAME="Cooper City";   STORE_DIR="stores/cooper-city/" ;;
          esac
          if [ -n "$STORE_DIR" ] && [ ! -d "$STORE_DIR" ]; then echo "$STORE_NAME has no tracker folder yet - nothing to report."; exit 0; fi
          TOTALS="${STORE_DIR}month_totals.json"; [ -f "$TOTALS" ] || echo '{}' > "$TOTALS"

          # ---- resolve month (override or today) ----
          YM="${INPUT_MONTH:-$(date -u +%Y-%m)}"
          YEAR=${YM%-*}; MON=$((10#${YM#*-}))
          MONTH_NAME=$(date -u -d "$YM-01" +%B)
          MONTH_DIR=$(echo "$MONTH_NAME" | tr '[:upper:]' '[:lower:]')
          MONTH_FILE="${STORE_DIR}${MONTH_DIR}/index.html"
          DAYS_IN_MONTH=$(date -u -d "$YM-01 +1 month -1 day" +%d)

          # ---- comparison month: the prior month, unless the tracker declares `const compareMonth = 'YYYY-MM'` ----
          PRIOR_YM=$(date -u -d "$YM-01 -1 month" +%Y-%m); LAST_YM="$PRIOR_YM"
          if [ -f "$MONTH_FILE" ]; then
            OVR=$(grep -oP "compareMonth\s*=\s*'\K\d{4}-\d{2}" "$MONTH_FILE" | head -1)
            [ -n "$OVR" ] && PRIOR_YM="$OVR"
          fi
          PRIOR_NAME=$(date -u -d "$PRIOR_YM-01" +%B)
          PRIOR_TOTAL=$(jq -r --arg k "$PRIOR_YM" '.[$k].total // empty' "$TOTALS")
          PRIOR_MEMB=$(jq -r --arg k "$PRIOR_YM" '.[$k].membership // empty' "$TOTALS")
          PRIOR_DAYS=$(jq -r --arg k "$PRIOR_YM" '.[$k].active_days // empty' "$TOTALS")
          PRIOR_NONMEMB=$(jq -r --arg k "$PRIOR_YM" '.[$k].non_membership // empty' "$TOTALS")
          BEST_PRIOR=$(jq -r --arg k "$YM" '[to_entries[]|select(.key!=$k)|.value.total]|max // 0' "$TOTALS")

          echo "Reporting $YM ($MONTH_NAME, $DAYS_IN_MONTH days) file=$MONTH_FILE prior=$PRIOR_YM=$PRIOR_TOTAL"

          # post to #plantation-revenue-updates through the bot; the old webhook (#broward-pbg-leadership) is only a fallback if the bot token is missing
          post() {
            if [ -n "$SLACK_BOT_TOKEN" ]; then
              R=$(curl -sS -X POST -H "Authorization: Bearer $SLACK_BOT_TOKEN" -H 'Content-type: application/json; charset=utf-8' \
                --data "{\"channel\":\"$REPORT_CHANNEL\",\"text\":$1,\"unfurl_links\":false}" https://slack.com/api/chat.postMessage)
              echo "$R" | jq -e '.ok' >/dev/null && return 0
              echo "::error::chat.postMessage failed: $(echo "$R" | jq -c '{error,needed,provided}')"; return 1
            fi
            curl -sS -X POST -H 'Content-type: application/json' --data "{\"text\":$1}" "$SLACK_WEBHOOK_URL"
          }
          FORMAT() { printf "%.0f" "$1" | sed -e :a -e 's/\B[0-9]\{3\}\>/,&/g;ta'; }

          if [ ! -f "$MONTH_FILE" ]; then
            echo "No tracker file for $YM - nothing to report."
            exit 0
          fi

          MTD=$(grep -oP "'$YM-\d+': \K[\d.]+" "$MONTH_FILE" | awk '{s+=$1} END {print s+0}')
          DAYS=$(grep -oP "'$YM-\d+': " "$MONTH_FILE" | wc -l)
          TARGET=$(grep -oP "const targetTotal = \K\d+" "$MONTH_FILE")
          DAYS_REM=$((DAYS_IN_MONTH - DAYS))

          if [ "$DAYS" -eq 0 ]; then
            post "$(printf '%s' "📊 $STORE_NAME · $MONTH_NAME tracker is live. No revenue entered yet." | jq -Rs .)"
            exit 0
          fi

          # membership = day 01 entry; service avg excludes it
          MEMBERSHIP=$(jq -r --arg k "$YM" '.[$k].membership // empty' "$TOTALS")
          MEMB_EXACT=1
          if [ -z "$MEMBERSHIP" ]; then
            MEMBERSHIP=$(grep -oP "'$YM-01': \K[\d.]+" "$MONTH_FILE" || echo 0)
            MEMB_EXACT=0
          fi
          if [ "$DAYS" -gt 1 ]; then
            DAILY_AVG=$(awk "BEGIN {printf \"%.0f\", ($MTD - $MEMBERSHIP) / ($DAYS - 1)}")
          else
            DAILY_AVG=0
          fi

          MTD_FMT=$(FORMAT $MTD); AVG_FMT=$(FORMAT $DAILY_AVG); TARGET_FMT=$(FORMAT $TARGET)

          # ---- month complete ----
          if [ "$DAYS_REM" -le 0 ]; then
            PCT=$(awk "BEGIN {printf \"%.1f\", 100*$MTD/$TARGET}")
            DSIGN=$(awk "BEGIN {print ($MTD>=$TARGET)?\"+\":\"-\"}")
            DELTA="$DSIGN\$$(FORMAT $(awk "BEGIN {printf \"%.0f\", ($MTD>=$TARGET)?$MTD-$TARGET:$TARGET-$MTD}"))"
            SERVICE=$(awk "BEGIN {printf \"%.2f\", $MTD-$MEMBERSHIP}")

            HEAD="✅ *$STORE_NAME · $MONTH_NAME Final: \$$MTD_FMT*"
            TGT_LABEL="• Target: \$$TARGET_FMT — $PCT% ($DELTA)"
            if [ -n "$PRIOR_TOTAL" ]; then
              TG=$(awk "BEGIN {printf \"%+.0f\", 100*($TARGET/$PRIOR_TOTAL - 1)}")
              TGT_LABEL="• Target ($TG% MoM): \$$TARGET_FMT — $PCT% ($DELTA)"
            fi
            LINES=("$HEAD" "$TGT_LABEL")

            if [ -n "$PRIOR_TOTAL" ]; then
              GP=$(awk "BEGIN {printf \"%+.1f\", 100*($MTD/$PRIOR_TOTAL - 1)}")
              SIGN=$(awk "BEGIN {print ($MTD>=$PRIOR_TOTAL)?\"+\":\"-\"}")
              GA="$SIGN\$$(FORMAT $(awk "BEGIN {printf \"%.0f\", ($MTD>=$PRIOR_TOTAL)?$MTD-$PRIOR_TOTAL:$PRIOR_TOTAL-$MTD}"))"
              LINES+=("• vs $PRIOR_NAME (\$$(FORMAT $PRIOR_TOTAL)): $GA ($GP%)")
            fi

            SVC_LINE="• Non-Membership Rev: \$$(FORMAT $SERVICE)"
            if [ -n "$PRIOR_NONMEMB" ]; then
              SG=$(awk "BEGIN {printf \"%+.1f\", 100*($SERVICE/$PRIOR_NONMEMB - 1)}")
              SVC_LINE="$SVC_LINE ($SG% vs $PRIOR_NAME"
            else
              SVC_LINE="$SVC_LINE ("
            fi
            MEMB_LINE="• Membership Rev: \$$(FORMAT $MEMBERSHIP)"
            if [ -n "$PRIOR_MEMB" ]; then
              MG=$(awk "BEGIN {printf \"%+.1f\", 100*($MEMBERSHIP/$PRIOR_MEMB - 1)}")
              MSIGN=$(awk "BEGIN {print ($MEMBERSHIP>=$PRIOR_MEMB)?\"+\":\"-\"}")
              MA="$MSIGN\$$(FORMAT $(awk "BEGIN {printf \"%.0f\", ($MEMBERSHIP>=$PRIOR_MEMB)?$MEMBERSHIP-$PRIOR_MEMB:$PRIOR_MEMB-$MEMBERSHIP}"))"
              MEMB_LINE="$MEMB_LINE ($MA, $MG% vs $PRIOR_NAME)"
            fi
            if [ "$MEMB_EXACT" = "1" ]; then
              LINES+=("$MEMB_LINE" "$SVC_LINE)")
            else
              # only the 1st-of-month batch is known until the MyTime export is reconciled;
              # anniversary dues (~30% of membership) are still inside the service figure
              LINES+=("• Membership / non-membership split: pending MyTime reconciliation")
            fi

            post "$(printf '%s\n' "${LINES[@]}" | jq -Rs .)"
            exit 0
          fi

          # ---- mid-month ----
          PROJECTION=$(awk "BEGIN {printf \"%.0f\", $MTD + ($DAILY_AVG * $DAYS_REM)}")
          PACE=$(awk "BEGIN {printf \"%.0f\", ($TARGET - $MTD) / $DAYS_REM}")
          TIERS=""
          HIT=0
          for d in 500 600 700 800 900 1000; do
            V=$(awk "BEGIN {printf \"%.0f\", $MTD + ($d * $DAYS_REM)}")
            if [ "$HIT" = "0" ] && [ "$(awk "BEGIN {print ($V>=$TARGET)}")" = "1" ]; then
              TIERS="$TIERS"$'\n'"• *\$$d/day → \$$(FORMAT $V)*"; HIT=1
            else
              TIERS="$TIERS"$'\n'"• \$$d/day → \$$(FORMAT $V)"
            fi
          done
          LATEST_VAL=$(grep -oP "'$YM-\d+': \K[\d.]+" "$MONTH_FILE" | tail -n 1)
          LATEST_DAY=$((10#$(grep -oP "'$YM-\K\d+" "$MONTH_FILE" | sort -n | tail -n 1)))
          LATEST_DOW=$(date -u -d "$YM-$(printf '%02d' $LATEST_DAY)" +%a)
          # same-day comparison against the prior month's tracker (straight-line run rate
          # is misleading early in the month because the 1st carries the membership batch)
          CMP=""
          PRIOR_FILE="${STORE_DIR}$(echo "$PRIOR_NAME" | tr '[:upper:]' '[:lower:]')/index.html"
          if [ -f "$PRIOR_FILE" ]; then
            PRIOR_MTD=$(grep -oP "'$PRIOR_YM-\d+': [\d.]+" "$PRIOR_FILE" | awk -F"[-': ]+" -v d="$LATEST_DAY" '{ if ($4+0 <= d+0) s+=$5 } END {print s+0}')
            if [ "$(awk "BEGIN {print ($PRIOR_MTD>0)}")" = "1" ]; then
              PD=$(awk "BEGIN {printf \"%+.1f\", 100*($MTD/$PRIOR_MTD - 1)}")
              PS=$(awk "BEGIN {print ($MTD>=$PRIOR_MTD)?\"+\":\"-\"}")
              PA="$PS\$$(FORMAT $(awk "BEGIN {printf \"%.0f\", ($MTD>=$PRIOR_MTD)?$MTD-$PRIOR_MTD:$PRIOR_MTD-$MTD}"))"
              CMP=" ($PA, $PD% vs $(echo $PRIOR_NAME | cut -c1-3))"
            fi
          fi
          LINES=("*$STORE_NAME · $MONTH_NAME · Day $DAYS of $DAYS_IN_MONTH, $DAYS_REM left*" \
                 "• Latest: $LATEST_DOW $MON/$LATEST_DAY *\$$(FORMAT $LATEST_VAL)*" \
                 "• MTD: *\$$MTD_FMT*$CMP" \
                 "• Avg: \$$AVG_FMT/day → projected close *\$$(FORMAT $PROJECTION)*" \
                 "• Target: \$$TARGET_FMT · need *\$$(FORMAT $PACE)/day*")
          if [ -n "$PRIOR_TOTAL" ]; then
            PACE_PRIOR=$(awk "BEGIN {printf \"%.0f\", ($PRIOR_TOTAL-$MTD)/$DAYS_REM}")
            if [ "$(awk "BEGIN {print ($MTD>=$PRIOR_TOTAL)}")" = "1" ]; then LINES+=("• Match $(echo $PRIOR_NAME | cut -c1-3): \$$(FORMAT $PRIOR_TOTAL) · *passed* ✓")
            else LINES+=("• Match $(echo $PRIOR_NAME | cut -c1-3): \$$(FORMAT $PRIOR_TOTAL) · need *\$$(FORMAT $PACE_PRIOR)/day*"); fi
          fi
          # the month just closed, as a reference, when the comparison was overridden
          if [ "$LAST_YM" != "$PRIOR_YM" ]; then
            LAST_TOTAL=$(jq -r --arg k "$LAST_YM" '.[$k].total // empty' "$TOTALS")
            if [ -n "$LAST_TOTAL" ]; then
              PACE_LAST=$(awk "BEGIN {printf \"%.0f\", ($LAST_TOTAL-$MTD)/$DAYS_REM}")
              if [ "$(awk "BEGIN {print ($MTD>=$LAST_TOTAL)}")" = "1" ]; then LINES+=("• Match $(date -u -d "$LAST_YM-01" +%b): \$$(FORMAT $LAST_TOTAL) · *passed* ✓")
              else LINES+=("• Match $(date -u -d "$LAST_YM-01" +%b): \$$(FORMAT $LAST_TOTAL) · need *\$$(FORMAT $PACE_LAST)/day*"); fi
            fi
          fi
          # the record month, when it is not the prior month
          BEST_YM=$(jq -r --arg k "$YM" '[to_entries[]|select(.key!=$k)]|max_by(.value.total)|.key // empty' "$TOTALS")
          if [ -n "$BEST_YM" ] && [ "$BEST_YM" != "$PRIOR_YM" ]; then
            BEST_NAME=$(date -u -d "$BEST_YM-01" +%b)
            PACE_BEST=$(awk "BEGIN {printf \"%.0f\", ($BEST_PRIOR-$MTD)/$DAYS_REM}")
            LINES+=("• Match $BEST_NAME (record): \$$(FORMAT $BEST_PRIOR) · need *\$$(FORMAT $PACE_BEST)/day*")
          fi
          # active members from the FBC scorecard (import_scorecard.py) vs the manager's membership bonus ladder
          if [ -f data/scorecard.json ]; then
            ACT=$(jq -r --arg l "$STORE_NAME" --arg ym "$YM" '.[$l] // {} | to_entries | map(select(.key|startswith($ym))) | map(select(.value.active)) | last | .value.active // empty' data/scorecard.json)
            ACT_D=$(jq -r --arg l "$STORE_NAME" --arg ym "$YM" '.[$l] // {} | to_entries | map(select(.key|startswith($ym))) | map(select(.value.active)) | last | .key // empty' data/scorecard.json)
            if [ -n "$ACT" ]; then
              AD=$(date -u -d "$ACT_D" +%-m/%-d)
              # month over month: active members at the end of the month just closed (FBC monthly report)
              MOM_YM=$(date -u -d "$YM-01 -1 month" +%Y-%m); MOM_N=$(date -u -d "$MOM_YM-01" +%b)
              PREV_ACT=$(jq -r --arg k "$MOM_YM" '.[$k].active_members // empty' "$TOTALS")
              if [ -n "$PREV_ACT" ]; then
                DA=$((ACT-PREV_ACT)); SG=$([ $DA -ge 0 ] && echo "+" || echo "")
                PCT=$(awk "BEGIN {printf \"%+.1f\", 100*($ACT/$PREV_ACT-1)}")
                LINES+=("• Members: *$ACT* active ($AD) · *$SG$DA* ($PCT%) MoM vs $MOM_N $PREV_ACT")
              else LINES+=("• Members: *$ACT* active ($AD)"); fi
            fi
          fi
          LINES+=("" "*Daily Average Scenarios:*$TIERS")
          post "$(printf '%s\n' "${LINES[@]}" | jq -Rs .)"
