name: Daily Slack Revenue Report

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Send to Slack
        run: |
          python3 << 'PYEOF'
import re
import subprocess
import json
import os

# Read tracker
with open('july/index.html', 'r') as f:
    content = f.read()

# Extract values using simple regex
mtd = float(re.search(r'const mtdTotal = ([\d.]+)', content).group(1))
days = int(re.search(r'const daysCompleted = (\d+)', content).group(1))
target = float(re.search(r'const targetTotal = ([\d.]+)', content).group(1))

# Calculate
days_remaining = 31 - days
daily_avg = (mtd - 12613.26) / (days - 1)
projection = mtd + (daily_avg * days_remaining)

# Build message
message = f"""📊 *July Revenue Status*

*Where We Stand:*
• MTD: ${mtd:,.0f}
• Days Complete: {days} | Days Remaining: {days_remaining}

*Performance:*
• Current Daily Avg: ${daily_avg:.0f}/day
• Projected Close: ${projection:,.0f}
• Target: ${target:,.0f}

*Daily Average Needed to Hit:*
  $300/day → ${(300 * days_remaining) + mtd:,.0f}
  $600/day → ${(600 * days_remaining) + mtd:,.0f}
  $900/day → ${(900 * days_remaining) + mtd:,.0f}"""

# Send to webhook
webhook = os.getenv('SLACK_WEBHOOK_URL')
payload = json.dumps({"text": message})

result = subprocess.run(
    ['curl', '-X', 'POST', '-H', 'Content-type: application/json', '--data', payload, webhook],
    capture_output=True
)

print("✅ Sent to Slack" if result.returncode == 0 else "❌ Failed")
PYEOF

        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

