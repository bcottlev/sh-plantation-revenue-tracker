name: Daily Slack Revenue Report

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Send to Slack
        run: |
          # Extract values from tracker using grep and sed
          MTD=$(grep "const mtdTotal = " july/index.html | sed "s/.*const mtdTotal = \([0-9.]*\).*/\1/")
          DAYS=$(grep "const daysCompleted = " july/index.html | sed "s/.*const daysCompleted = \([0-9]*\).*/\1/")
          TARGET=$(grep "const targetTotal = " july/index.html | sed "s/.*const targetTotal = \([0-9]*\).*/\1/")
          
          echo "MTD: $MTD, Days: $DAYS, Target: $TARGET"
          
          # Calculate metrics
          DAYS_REM=$((31 - DAYS))
          DAILY_AVG=$(awk "BEGIN {printf \"%.0f\", ($MTD - 12613) / ($DAYS - 1)}")
          PROJECTION=$(awk "BEGIN {printf \"%.0f\", $MTD + ($DAILY_AVG * $DAYS_REM)}")
          
          TIER_300=$(awk "BEGIN {printf \"%.0f\", (300 * $DAYS_REM) + $MTD}")
          TIER_600=$(awk "BEGIN {printf \"%.0f\", (600 * $DAYS_REM) + $MTD}")
          TIER_900=$(awk "BEGIN {printf \"%.0f\", (900 * $DAYS_REM) + $MTD}")
          
          # Send to Slack
          MESSAGE="📊 *July Revenue Status*\n\n*Where We Stand:*\n• MTD: \$$(printf \"%.0f\" $MTD | sed -e :a -e 's/\B[0-9]\{3\}\>/,&/g;ta')\n• Days Complete: $DAYS | Days Remaining: $DAYS_REM\n\n*Performance:*\n• Current Daily Avg: \$$DAILY_AVG/day\n• Projected Close: \$$(printf \"%.0f\" $PROJECTION | sed -e :a -e 's/\B[0-9]\{3\}\>/,&/g;ta')\n• Target: \$$(printf \"%.0f\" $TARGET | sed -e :a -e 's/\B[0-9]\{3\}\>/,&/g;ta')\n\n*Daily Average Needed to Hit:*\n  \$300/day → \$$(printf \"%.0f\" $TIER_300 | sed -e :a -e 's/\B[0-9]\{3\}\>/,&/g;ta')\n  \$600/day → \$$(printf \"%.0f\" $TIER_600 | sed -e :a -e 's/\B[0-9]\{3\}\>/,&/g;ta')\n  \$900/day → \$$(printf \"%.0f\" $TIER_900 | sed -e :a -e 's/\B[0-9]\{3\}\>/,&/g;ta')"
          
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"$MESSAGE\"}" \
            "${{ secrets.SLACK_WEBHOOK_URL }}"
          
          echo "✅ Sent to Slack"

