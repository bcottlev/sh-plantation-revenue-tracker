name: Daily Slack Revenue Report

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Send August Revenue to Slack
        run: |
          # Extract dailyRevenue entries from August tracker
          ENTRIES=$(grep -oP "'2026-08-\d+': \K[\d.]+(?=,)" august/index.html | tr '\n' ' ')
          
          # Calculate MTD sum
          MTD=$(echo "$ENTRIES" | awk '{sum=0; for(i=1;i<=NF;i++) sum+=$i; print sum}')
          
          # Count days
          DAYS=$(grep -oP "'2026-08-\d+'" august/index.html | wc -l)
          
          # Extract target
          TARGET=$(grep -oP "const targetTotal = \K\d+" august/index.html)
          
          echo "MTD: $MTD, Days: $DAYS, Target: $TARGET"
          
          # Calculate derived values
          DAYS_REM=$((31 - DAYS))
          DAILY_AVG=$(awk "BEGIN {printf \"%.0f\", ($MTD - 12618) / ($DAYS - 1)}")
          PROJECTION=$(awk "BEGIN {printf \"%.0f\", $MTD + ($DAILY_AVG * $DAYS_REM)}")
          
          # Format numbers with commas
          FORMAT_NUM() {
            printf "%.0f" "$1" | sed -e :a -e 's/\B[0-9]\{3\}\>/,&/g;ta'
          }
          
          # Build tier lines for $100 increments
          TIERS=""
          for DAILY in 100 200 300 400 500 600 700 800 900 1000; do
            PROJ=$(awk "BEGIN {printf \"%.0f\", ($MTD) + ($DAILY * $DAYS_REM)}")
            TIERS="$TIERS\n  \$$DAILY/day → \$$(FORMAT_NUM $PROJ)"
          done
          
          # Build message
          MSG="📊 *August Revenue Status*\n\n*Where We Stand:*\n• MTD: \$$(FORMAT_NUM $MTD)\n• Days Complete: $DAYS | Days Remaining: $DAYS_REM\n\n*Performance:*\n• Current Daily Avg: \$$(FORMAT_NUM $DAILY_AVG)/day\n• Projected Close: \$$(FORMAT_NUM $PROJECTION)\n• Target: \$$(FORMAT_NUM $TARGET)\n\n*Daily Average Needed to Hit:*$TIERS"
          
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"$MSG\"}" \
            "${{ secrets.SLACK_WEBHOOK_URL }}"
          
          echo "Message sent"

