name: Daily Slack Revenue Report

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Send to Slack
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{"text":"📊 *July Revenue Status*\n\n*Where We Stand:*\n• MTD: $23,922\n• Days Complete: 21 | Days Remaining: 10\n\n*Performance:*\n• Current Daily Avg: $565/day\n• Projected Close: $29,576\n• Target: $33,755\n\n*Daily Average Needed to Hit:*\n  $300/day → $29,922\n  $600/day → $35,922\n  $900/day → $38,422"}' \
            "${{ secrets.SLACK_WEBHOOK_URL }}"
          echo "✅ Sent to Slack"

