name: Daily Slack Revenue Report

on:
  workflow_dispatch:

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Test Slack Webhook
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{"text":"📊 Test: August Revenue Status\n\nMTD: $21,026\nDays: 14\nTarget: $32,529"}' \
            "${{ secrets.SLACK_WEBHOOK_URL }}"
          echo "Message sent"

