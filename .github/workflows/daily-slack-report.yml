name: Daily Slack Revenue Report

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Send August Revenue to Slack
        run: |
          # Extract dailyRevenue entries from August tracker
          ENTRIES=$(grep -oP "'2026-08-\d+': \K[\d.]+(?=,)" august/index.html | tr '\n' ' ')
          
          # Calculate MTD sum
          MTD=$(echo "$ENTRIES" | awk '{sum=0; for(i=1;i<=NF;i++) sum+=$i; print sum}')
          
          # Count days
          DAYS=$(grep -oP "'2026-08-\d+'" august/index.html | wc -l)
          
          # Extract target
          TARGET=$(grep -oP "const targetTotal = \K\d+" august/index.html)
          
          echo "MTD: $MTD, Days: $DAYS, Target: $TARGET"
          
          # Calculate derived values
          DAYS_REM=$((31 - DAYS))
          DAILY_AVG=$(awk "BEGIN {printf \"%.0f\", ($MTD - 12618) / ($DAYS - 1)}")
          PROJECTION=$(awk "BEGIN {printf \"%.0f\", $MTD + ($DAILY_AVG * $DAYS_REM)}")
          
          # Build message
          MSG="📊 *August Revenue Status*\n\n*Where We Stand:*\n• MTD: \$$(printf "%.0f" $MTD | sed -e :a -e 's/\B[0-9]\{3\}\>/,&/g;ta')\n• Days Complete: $DAYS | Days Remaining: $DAYS_REM\n\n*Performance:*\n• Current Daily Avg: \$$DAILY_AVG/day\n• Projected Close: \$$(printf "%.0f" $PROJECTION | sed -e :a -e 's/\B[0-9]\{3\}\>/,&/g;ta')\n• Target: \$$(printf "%.0f" $TARGET | sed -e :a -e 's/\B[0-9]\{3\}\>/,&/g;ta')\n\n*Daily Average Needed to Hit:*\n  \$300/day → \$$(awk "BEGIN {printf \"%.0f\", (300 * $DAYS_REM) + $MTD}" | sed -e :a -e 's/\B[0-9]\{3\}\>/,&/g;ta')\n  \$600/day → \$$(awk "BEGIN {printf \"%.0f\", (600 * $DAYS_REM) + $MTD}" | sed -e :a -e 's/\B[0-9]\{3\}\>/,&/g;ta')\n  \$900/day → \$$(awk "BEGIN {printf \"%.0f\", (900 * $DAYS_REM) + $MTD}" | sed -e :a -e 's/\B[0-9]\{3\}\>/,&/g;ta')"
          
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"$MSG\"}" \
            "${{ secrets.SLACK_WEBHOOK_URL }}"
          
          echo "Message sent"

