name: Daily Slack Revenue Report

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Send August Revenue to Slack
        run: |
          # Extract dailyRevenue entries from August tracker
          ENTRIES=$(grep -oP "'2026-08-\d+': \K[\d.]+(?=,)" august/index.html | tr '\n' ' ')
          
          # Calculate MTD sum
          MTD=$(echo "$ENTRIES" | awk '{sum=0; for(i=1;i<=NF;i++) sum+=$i; print sum}')
          
          # Count days
          DAYS=$(grep -oP "'2026-08-\d+'" august/index.html | wc -l)
          
          # Extract target
          TARGET=$(grep -oP "const targetTotal = \K\d+" august/index.html)
          
          echo "MTD: $MTD, Days: $DAYS, Target: $TARGET"
          
          # Calculate derived values
          DAYS_REM=$((31 - DAYS))
          DAILY_AVG=$(awk "BEGIN {printf \"%.0f\", ($MTD - 12618) / ($DAYS - 1)}")
          PROJECTION=$(awk "BEGIN {printf \"%.0f\", $MTD + ($DAILY_AVG * $DAYS_REM)}")
          
          # Format numbers with commas
          MTD_FMT=$(printf "%.0f" $MTD | sed -e :a -e 's/\B[0-9]\{3\}\>/,&/g;ta')
          AVG_FMT=$(printf "%.0f" $DAILY_AVG | sed -e :a -e 's/\B[0-9]\{3\}\>/,&/g;ta')
          PROJ_FMT=$(printf "%.0f" $PROJECTION | sed -e :a -e 's/\B[0-9]\{3\}\>/,&/g;ta')
          TARGET_FMT=$(printf "%.0f" $TARGET | sed -e :a -e 's/\B[0-9]\{3\}\>/,&/g;ta')
          
          # Build tier lines with proper formatting
          TIER_100=$(awk "BEGIN {printf \"%.0f\", $MTD + (100 * $DAYS_REM)}" | sed -e :a -e 's/\B[0-9]\{3\}\>/,&/g;ta')
          TIER_200=$(awk "BEGIN {printf \"%.0f\", $MTD + (200 * $DAYS_REM)}" | sed -e :a -e 's/\B[0-9]\{3\}\>/,&/g;ta')
          TIER_300=$(awk "BEGIN {printf \"%.0f\", $MTD + (300 * $DAYS_REM)}" | sed -e :a -e 's/\B[0-9]\{3\}\>/,&/g;ta')
          TIER_400=$(awk "BEGIN {printf \"%.0f\", $MTD + (400 * $DAYS_REM)}" | sed -e :a -e 's/\B[0-9]\{3\}\>/,&/g;ta')
          TIER_500=$(awk "BEGIN {printf \"%.0f\", $MTD + (500 * $DAYS_REM)}" | sed -e :a -e 's/\B[0-9]\{3\}\>/,&/g;ta')
          TIER_600=$(awk "BEGIN {printf \"%.0f\", $MTD + (600 * $DAYS_REM)}" | sed -e :a -e 's/\B[0-9]\{3\}\>/,&/g;ta')
          TIER_700=$(awk "BEGIN {printf \"%.0f\", $MTD + (700 * $DAYS_REM)}" | sed -e :a -e 's/\B[0-9]\{3\}\>/,&/g;ta')
          TIER_800=$(awk "BEGIN {printf \"%.0f\", $MTD + (800 * $DAYS_REM)}" | sed -e :a -e 's/\B[0-9]\{3\}\>/,&/g;ta')
          TIER_900=$(awk "BEGIN {printf \"%.0f\", $MTD + (900 * $DAYS_REM)}" | sed -e :a -e 's/\B[0-9]\{3\}\>/,&/g;ta')
          TIER_1000=$(awk "BEGIN {printf \"%.0f\", $MTD + (1000 * $DAYS_REM)}" | sed -e :a -e 's/\B[0-9]\{3\}\>/,&/g;ta')
          
          # Build JSON payload with proper escaping
          cat > /tmp/slack_payload.json << JSONEOF
          {
            "text": "📊 *August Revenue Status*\n\n*Where We Stand:*\n• MTD: \$$MTD_FMT\n• Days Complete: $DAYS | Days Remaining: $DAYS_REM\n\n*Performance:*\n• Current Daily Avg: \$$AVG_FMT/day\n• Projected Close: \$$PROJ_FMT\n• Target: \$$TARGET_FMT\n\n*Daily Average Needed to Hit:*\n• \$100/day → \$$TIER_100\n• \$200/day → \$$TIER_200\n• \$300/day → \$$TIER_300\n• \$400/day → \$$TIER_400\n• \$500/day → \$$TIER_500\n• \$600/day → \$$TIER_600\n• \$700/day → \$$TIER_700\n• \$800/day → \$$TIER_800\n• \$900/day → \$$TIER_900\n• \$1000/day → \$$TIER_1000"
          }
          JSONEOF
          
          curl -X POST -H 'Content-type: application/json' \
            --data @/tmp/slack_payload.json \
            "${{ secrets.SLACK_WEBHOOK_URL }}"
          
          echo "Message sent"

