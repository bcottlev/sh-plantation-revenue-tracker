name: Daily Slack Revenue Report

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Send August Revenue to Slack
        run: |
          # Extract dailyRevenue entries from August tracker
          ENTRIES=$(grep -oP "'2026-08-\d+': \K[\d.]+(?=,)" august/index.html | tr '\n' ' ')
          
          # Calculate MTD sum
          MTD=$(echo "$ENTRIES" | awk '{sum=0; for(i=1;i<=NF;i++) sum+=$i; print sum}')
          
          # Count days
          DAYS=$(grep -oP "'2026-08-\d+'" august/index.html | wc -l)
          
          # Extract target
          TARGET=$(grep -oP "const targetTotal = \K\d+" august/index.html)
          
          # Calculate derived values
          DAYS_REM=$((31 - DAYS))
          DAILY_AVG=$(awk "BEGIN {printf \"%.0f\", ($MTD - 12618) / ($DAYS - 1)}")
          PROJECTION=$(awk "BEGIN {printf \"%.0f\", $MTD + ($DAILY_AVG * $DAYS_REM)}")
          
          # Format numbers with commas
          FORMAT() { printf "%.0f" "$1" | sed -e :a -e 's/\B[0-9]\{3\}\>/,&/g;ta'; }
          MTD_FMT=$(FORMAT $MTD)
          AVG_FMT=$(FORMAT $DAILY_AVG)
          PROJ_FMT=$(FORMAT $PROJECTION)
          TARGET_FMT=$(FORMAT $TARGET)
          
          # Calculate tiers
          TIER_100=$(FORMAT $((${MTD%.*} + (100 * DAYS_REM))))
          TIER_200=$(FORMAT $((${MTD%.*} + (200 * DAYS_REM))))
          TIER_300=$(FORMAT $((${MTD%.*} + (300 * DAYS_REM))))
          TIER_400=$(FORMAT $((${MTD%.*} + (400 * DAYS_REM))))
          TIER_500=$(FORMAT $((${MTD%.*} + (500 * DAYS_REM))))
          TIER_600=$(FORMAT $((${MTD%.*} + (600 * DAYS_REM))))
          TIER_700=$(FORMAT $((${MTD%.*} + (700 * DAYS_REM))))
          TIER_800=$(FORMAT $((${MTD%.*} + (800 * DAYS_REM))))
          TIER_900=$(FORMAT $((${MTD%.*} + (900 * DAYS_REM))))
          TIER_1000=$(FORMAT $((${MTD%.*} + (1000 * DAYS_REM))))
          
          # Build text with newlines
          MSG=$(printf '%s\n' \
            "📊 *August Revenue Status*" \
            "" \
            "*Where We Stand:*" \
            "• MTD: \$$MTD_FMT" \
            "• Days Complete: $DAYS | Days Remaining: $DAYS_REM" \
            "" \
            "*Performance:*" \
            "• Current Daily Avg: \$$AVG_FMT/day" \
            "• Projected Close: \$$PROJ_FMT" \
            "• Target: \$$TARGET_FMT" \
            "" \
            "*Daily Average Needed to Hit:*" \
            "• \$100/day → \$$TIER_100" \
            "• \$200/day → \$$TIER_200" \
            "• \$300/day → \$$TIER_300" \
            "• \$400/day → \$$TIER_400" \
            "• \$500/day → \$$TIER_500" \
            "• \$600/day → \$$TIER_600" \
            "• \$700/day → \$$TIER_700" \
            "• \$800/day → \$$TIER_800" \
            "• \$900/day → \$$TIER_900" \
            "• \$1000/day → \$$TIER_1000" | jq -Rs .)
          
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":$MSG}" \
            "${{ secrets.SLACK_WEBHOOK_URL }}"

