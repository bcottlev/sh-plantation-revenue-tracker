name: Daily Slack Revenue Report

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      month:
        description: 'Month to report as YYYY-MM (blank = current month)'
        required: false
        default: ''

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Send Revenue Report to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          INPUT_MONTH: ${{ github.event.inputs.month }}
        run: |
          # ---- resolve month (override or today) ----
          YM="${INPUT_MONTH:-$(date -u +%Y-%m)}"
          YEAR=${YM%-*}; MON=${YM#*-}
          MONTH_NAME=$(date -u -d "$YM-01" +%B)
          MONTH_DIR=$(echo "$MONTH_NAME" | tr '[:upper:]' '[:lower:]')
          MONTH_FILE="$MONTH_DIR/index.html"
          DAYS_IN_MONTH=$(date -u -d "$YM-01 +1 month -1 day" +%d)

          # ---- prior month ----
          PRIOR_YM=$(date -u -d "$YM-01 -1 month" +%Y-%m)
          PRIOR_NAME=$(date -u -d "$PRIOR_YM-01" +%B)
          PRIOR_TOTAL=$(jq -r --arg k "$PRIOR_YM" '.[$k].total // empty' month_totals.json)
          PRIOR_MEMB=$(jq -r --arg k "$PRIOR_YM" '.[$k].membership // empty' month_totals.json)
          PRIOR_DAYS=$(jq -r --arg k "$PRIOR_YM" '.[$k].days // empty' month_totals.json)
          BEST_PRIOR=$(jq -r --arg k "$YM" '[to_entries[]|select(.key!=$k)|.value.total]|max // 0' month_totals.json)

          echo "Reporting $YM ($MONTH_NAME, $DAYS_IN_MONTH days) file=$MONTH_FILE prior=$PRIOR_YM=$PRIOR_TOTAL"

          post() { curl -sS -X POST -H 'Content-type: application/json' --data "{\"text\":$1}" "$SLACK_WEBHOOK_URL"; }
          FORMAT() { printf "%.0f" "$1" | sed -e :a -e 's/\B[0-9]\{3\}\>/,&/g;ta'; }

          if [ ! -f "$MONTH_FILE" ]; then
            echo "No tracker file for $YM - nothing to report."
            exit 0
          fi

          MTD=$(grep -oP "'$YM-\d+': \K[\d.]+" "$MONTH_FILE" | awk '{s+=$1} END {print s+0}')
          DAYS=$(grep -oP "'$YM-\d+'" "$MONTH_FILE" | wc -l)
          TARGET=$(grep -oP "const targetTotal = \K\d+" "$MONTH_FILE")
          DAYS_REM=$((DAYS_IN_MONTH - DAYS))

          if [ "$DAYS" -eq 0 ]; then
            post "$(printf '%s' "📊 $MONTH_NAME tracker is live. No revenue entered yet." | jq -Rs .)"
            exit 0
          fi

          # membership = day 01 entry; service avg excludes it
          MEMBERSHIP=$(grep -oP "'$YM-01': \K[\d.]+" "$MONTH_FILE" || echo 0)
          if [ "$DAYS" -gt 1 ]; then
            DAILY_AVG=$(awk "BEGIN {printf \"%.0f\", ($MTD - $MEMBERSHIP) / ($DAYS - 1)}")
          else
            DAILY_AVG=0
          fi

          MTD_FMT=$(FORMAT $MTD); AVG_FMT=$(FORMAT $DAILY_AVG); TARGET_FMT=$(FORMAT $TARGET)

          # ---- month complete ----
          if [ "$DAYS_REM" -le 0 ]; then
            PCT=$(awk "BEGIN {printf \"%.1f\", 100*$MTD/$TARGET}")
            DSIGN=$(awk "BEGIN {print ($MTD>=$TARGET)?\"+\":\"-\"}")
            DELTA="$DSIGN\$$(FORMAT $(awk "BEGIN {printf \"%.0f\", ($MTD>=$TARGET)?$MTD-$TARGET:$TARGET-$MTD}"))"
            SERVICE=$(awk "BEGIN {printf \"%.2f\", $MTD-$MEMBERSHIP}")

            HEAD="✅ *$MONTH_NAME Final: \$$MTD_FMT*"
            TGT_LABEL="• Target: \$$TARGET_FMT — $PCT% ($DELTA)"
            if [ -n "$PRIOR_TOTAL" ]; then
              TG=$(awk "BEGIN {printf \"%+.0f\", 100*($TARGET/$PRIOR_TOTAL - 1)}")
              TGT_LABEL="• Target ($TG% MoM): \$$TARGET_FMT — $PCT% ($DELTA)"
            fi
            LINES=("$HEAD" "$TGT_LABEL")

            if [ -n "$PRIOR_TOTAL" ]; then
              GP=$(awk "BEGIN {printf \"%+.1f\", 100*($MTD/$PRIOR_TOTAL - 1)}")
              SIGN=$(awk "BEGIN {print ($MTD>=$PRIOR_TOTAL)?\"+\":\"-\"}")
              GA="$SIGN\$$(FORMAT $(awk "BEGIN {printf \"%.0f\", ($MTD>=$PRIOR_TOTAL)?$MTD-$PRIOR_TOTAL:$PRIOR_TOTAL-$MTD}"))"
              LINES+=("• vs $PRIOR_NAME (\$$(FORMAT $PRIOR_TOTAL)): $GA ($GP%)")
            fi

            SVC_LINE="• Non-Membership Rev: \$$(FORMAT $SERVICE) (\$$AVG_FMT/day"
            if [ -n "$PRIOR_MEMB" ] && [ -n "$PRIOR_DAYS" ]; then
              PSD=$(awk "BEGIN {printf \"%.2f\", ($PRIOR_TOTAL-$PRIOR_MEMB)/($PRIOR_DAYS-1)}")
              SVC_GROWTH=$(awk "BEGIN {printf \"%+.1f\", 100*($DAILY_AVG/$PSD - 1)}")
              SVC_LINE="$SVC_LINE, $SVC_GROWTH% vs $PRIOR_NAME"
            fi
            MEMB_LINE="• Membership Rev: \$$(FORMAT $MEMBERSHIP)"
            if [ -n "$PRIOR_MEMB" ]; then
              MG=$(awk "BEGIN {printf \"%+.1f\", 100*($MEMBERSHIP/$PRIOR_MEMB - 1)}")
              MSIGN=$(awk "BEGIN {print ($MEMBERSHIP>=$PRIOR_MEMB)?\"+\":\"-\"}")
              MA="$MSIGN\$$(FORMAT $(awk "BEGIN {printf \"%.0f\", ($MEMBERSHIP>=$PRIOR_MEMB)?$MEMBERSHIP-$PRIOR_MEMB:$PRIOR_MEMB-$MEMBERSHIP}"))"
              MEMB_LINE="$MEMB_LINE ($MA, $MG% vs $PRIOR_NAME)"
            fi
            LINES+=("$MEMB_LINE" "$SVC_LINE)")

            post "$(printf '%s\n' "${LINES[@]}" | jq -Rs .)"
            exit 0
          fi

          # ---- mid-month ----
          PROJECTION=$(awk "BEGIN {printf \"%.0f\", $MTD + ($DAILY_AVG * $DAYS_REM)}")
          PACE=$(awk "BEGIN {printf \"%.0f\", ($TARGET - $MTD) / $DAYS_REM}")
          TIERS=""
          for d in 500 600 700 800 900 1000; do
            V=$(awk "BEGIN {printf \"%.0f\", $MTD + ($d * $DAYS_REM)}")
            TIERS="$TIERS"$'\n'"• \$$d/day → \$$(FORMAT $V)"
          done
          LINES=("• MTD: \$$MTD_FMT (latest $MON/$DAYS)" "• Days Complete: $DAYS | Days Remaining: $DAYS_REM" \
                 "• Current Daily Avg: \$$AVG_FMT" "• Projected Close: \$$(FORMAT $PROJECTION)" \
                 "• EoM Target: \$$TARGET_FMT" "• Daily Pace Needed: \$$(FORMAT $PACE) to hit target")
          if [ -n "$PRIOR_TOTAL" ]; then
            PACEV=$(awk "BEGIN {printf \"%+.1f\", 100*(($MTD/$DAYS*$DAYS_IN_MONTH)/$PRIOR_TOTAL - 1)}")
            LINES+=("• Pace vs $PRIOR_NAME: $PACEV%")
          fi
          LINES+=("" "Daily Average Scenarios:$TIERS")
          post "$(printf '%s\n' "${LINES[@]}" | jq -Rs .)"
